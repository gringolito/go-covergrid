name: attachment-probe

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Upload with a wider GITHUB_TOKEN, then post a user-uploaded asset as the bot
        env:
          TOKEN: ${{ github.token }}
          REPO_ID: ${{ github.event.repository.id }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          printf '<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"/>' > p.svg
          code=$(curl -s -o resp.json -w '%{http_code}' \
            "https://uploads.github.com/user-attachments/assets?name=p.svg&content_type=image%2Fsvg%2Bxml&repository_id=${REPO_ID}" \
            -X POST -H "Authorization: Bearer ${TOKEN}" -H "Accept: application/json" \
            -H "Content-Type: application/octet-stream" --data-binary @p.svg)
          echo "contents:write GITHUB_TOKEN -> HTTP ${code}"; cat resp.json; echo
          gh pr comment "$PR" --body "probe: bot-posted comment embedding a user-uploaded asset ![grid map](https://github.com/user-attachments/assets/b11b7af6-7574-4073-a878-fa092c7c4733)"
