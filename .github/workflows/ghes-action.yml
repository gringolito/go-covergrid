name: GHES action

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Regenerate ghes/action.yml
        run: node scripts/build-ghes-action.js

      - name: Check the committed copy is current
        run: |
          if [[ -n "$(git status --porcelain -- ghes/)" ]]; then
            git diff -- ghes/
            echo "::error file=ghes/action.yml::ghes/action.yml is stale. Regenerate it with: node scripts/build-ghes-action.js"
            exit 1
          fi
