name: Probe the image host

# Diagnostic, not a gate. Catbox is a third party reachable only from a runner —
# catbox.moe does not resolve on the development network (ADR-0002) — so this is the only
# place its behaviour can be observed. It uploads the committed example grid map, which is
# rendered from a synthetic fixture and already public in this repository, so there is
# nothing to disclose.
#
# Never let a host that works here quietly become the implementation without also updating
# scripts/publish-image.sh and ADR-0002. A host has to pass BOTH checks to be a candidate:
# the upload has to succeed, and the returned URL has to answer with an `image/*`
# Content-Type, because GitHub's camo proxy refuses everything else. Plenty of hosts serve
# an uploaded .svg as text/plain deliberately, to stop it executing script in their own
# origin, and such a host is useless here however well it uploads.

on:
  workflow_dispatch:
  push:
    branches: ['probe/**']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Every host is tried even after one fails, so a single run answers the question.
      # `--fail` stays off: the response body is the interesting part of a refusal.
      - name: Try each candidate host
        run: |
          svg=docs/example-grid-map.svg
          # 0x0.st and its clones reject curl's default User-Agent outright.
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Safari/537.36'

          # $1 label, $2 endpoint, $3.. extra curl args (the form fields differ per host)
          probe() {
            label="$1"; endpoint="$2"; shift 2
            echo "::group::${label}"
            code=$(curl --silent --show-error --max-time 90 --user-agent "$ua" \
              --write-out '%{http_code}' --output "$RUNNER_TEMP/body" \
              "$@" "$endpoint" 2>&1) || code="curl-error"
            body=$(tr -d '\r\n' <"$RUNNER_TEMP/body" | head -c 300)
            echo "upload status: ${code}"
            echo "upload body:   ${body}"

            # Pull the first https URL out of the body: some hosts answer with the bare URL,
            # others with JSON around it.
            url=$(grep -oE 'https://[^"[:space:]\\]+' <<<"$body" | head -1)
            if [[ -n "$url" ]]; then
              ct=$(curl --silent --show-error --location --head --max-time 30 --user-agent "$ua" \
                --write-out '%{http_code} %{content_type}' --output /dev/null "$url" 2>&1) \
                || ct="curl-error"
              echo "url:           ${url}"
              echo "GET status/type: ${ct}"
              case "$ct" in
                2*[[:space:]]image/*) echo "VERDICT: candidate — uploads and serves an image type" ;;
                *) echo "VERDICT: unusable — camo refuses anything that is not image/*" ;;
              esac
            else
              echo "VERDICT: unusable — no URL in the response"
            fi
            echo "::endgroup::"
          }

          # Retention is quoted from each host's own front page; it decides whether a two-year-old
          # pull request comment still shows its picture, so it matters as much as the verdict.
          # Catbox, for the record of the refusal. 412 "Invalid uploader" as of this writing.
          probe 'catbox.moe (permanent)' https://catbox.moe/user/api.php \
            --form reqtype=fileupload --form "fileToUpload=@${svg}"

          # Same operator, anonymous by design, but 72h maximum — every historical comment
          # would rot. Probed only to tell an account block apart from an address-range block.
          probe 'litterbox.catbox.moe (72h — diagnostic only, never ship this)' \
            https://litterbox.catbox.moe/resources/internals/api.php \
            --form reqtype=fileupload --form time=72h --form "fileToUpload=@${svg}"

          # 0x0.st: retention scales down with size, ~1 year for something this small.
          probe '0x0.st (~1 year for a small file)' https://0x0.st --form "file=@${svg}"

          # Clones of 0x0.st with the same API and their own retention rules.
          probe 'envs.sh (~1 year for a small file)' https://envs.sh --form "file=@${svg}"
          probe 'x0.at (~1 year for a small file)' https://x0.at --form "file=@${svg}"

          # Short-lived; probed to complete the picture, not as candidates.
          probe 'uguu.se (3 hours)' 'https://uguu.se/upload?output=text' --form "files[]=@${svg}"
          probe 'tmpfiles.org (1 hour)' https://tmpfiles.org/api/v1/upload --form "file=@${svg}"

      - name: Summarise
        if: always()
        run: |
          echo 'Read the VERDICT line in each group above. A host needs a successful upload AND'
          echo 'an image/* Content-Type on the returned URL. Retention decides whether old pull'
          echo 'request comments keep their picture; anything under a year is not a real option.'
